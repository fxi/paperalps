<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#111112" />
    <title>Paper Alps</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M2 26 12 8l5 8 4-5 9 15z' fill='%23ddd' stroke='%23222' stroke-width='2' stroke-linejoin='round'/></svg>" />
  </head>
  <body class="ink">
    <canvas id="terrain" aria-label="The Alps rendered as folded paper"></canvas>
    <svg id="trail" aria-hidden="true"></svg>
    <div id="labels"></div>
    <!-- above the labels: tappable world points (lamps…) win over a label under them -->
    <svg id="world"></svg>
    <div id="zone-left" class="zone zone-left" aria-hidden="true"></div>
    <div id="zone-right" class="zone zone-right" aria-hidden="true"></div>

    <div id="hud">
      <div class="readout">
        <div class="alt-box"><span>ALT</span> <span id="alt-value">····</span></div>
        <div id="gnd" class="sub"></div>
        <div id="coord" class="sub"></div>
      </div>

      <div class="toolbar">
        <button id="music" class="chip sound" aria-pressed="false" aria-label="Turn sound on" title="Sound (M)">
          <span data-icon="speaker-high" data-icon-class="i-on"></span><span data-icon="speaker-x" data-icon-class="i-off"></span>
        </button>
        <button id="inkmode" class="chip" title="Paper (I)">
          <span data-icon="circle-half"></span>
        </button>
        <button id="notebook" class="chip" aria-label="Open the notebook" title="Notebook (C)">
          <span data-icon="book-open"></span>
        </button>
        <button id="minimap" class="chip" aria-pressed="true" title="Map (P)">
          <span data-icon="map-trifold"></span>
        </button>
        <button id="north" class="chip" aria-label="Reset north up" title="North up (N)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l4 8.5h-8z" /><path d="M8 12h8l-4 8.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" /></svg>
        </button>
      </div>

      <div id="toolbox" class="toolbox">
        <button class="chip" data-tool="enigma" aria-label="enigma" title="enigma">
          <span data-icon="lock-key"></span>
        </button>
        <button class="chip" data-tool="notepad" aria-label="notepad" title="notepad">
          <span data-icon="notepad"></span>
        </button>
        <button class="chip" data-tool="binutf" aria-label="binutf" title="binutf">
          <span data-icon="binary"></span>
        </button>
        <button class="chip" data-tool="gis" aria-label="gis" title="gis">
          <span data-icon="stack"></span>
        </button>
        <button class="chip" data-tool="recorder" aria-label="recorder" title="recorder">
          <span data-icon="microphone"></span>
        </button>
        <button class="chip" data-tool="quine" aria-label="quine" title="quine">
          <span data-icon="code-block"></span>
        </button>
      </div>

      <div class="topright">
        <div id="mapbox" class="mapbox"></div>
      </div>

      <div class="hint">w/s throttle · a/d yaw · ↓↑ pitch · ←→ roll · c notebook · t plan · i ink · p map · n north · m sound</div>
    </div>

    <div id="veil">
      <div class="veil-title">PAPER ALPS</div>
      <div class="veil-sub">unfolding terrain…</div>
      <div class="veil-actions">
        <button id="enter" class="enter" title="Enter (↵)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" /></svg>
          <span>FLY</span>
        </button>
        <button id="veil-sound" class="chip sound" aria-pressed="true" aria-label="Turn sound off" title="Sound">
          <span data-icon="speaker-high" data-icon-class="i-on"></span><span data-icon="speaker-x" data-icon-class="i-off"></span>
        </button>
      </div>
    </div>

    <footer class="credits">
      DEM <a href="https://mapterhorn.com" target="_blank" rel="noopener">Mapterhorn</a> · peaks © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · icons <a href="https://phosphoricons.com" target="_blank" rel="noopener">Phosphor</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
