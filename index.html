<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#111112" />
    <title>Paper Alps</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M2 26 12 8l5 8 4-5 9 15z' fill='%23ddd' stroke='%23222' stroke-width='2' stroke-linejoin='round'/></svg>" />
  </head>
  <body class="ink">
    <canvas id="terrain" aria-label="The Alps rendered as folded paper"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div id="zone-left" class="zone zone-left" aria-hidden="true"></div>
    <div id="zone-right" class="zone zone-right" aria-hidden="true"></div>

    <div id="hud">
      <div class="readout">
        <div class="alt-box"><span>ALT</span> <span id="alt-value">····</span></div>
        <div id="gnd" class="sub"></div>
        <div id="coord" class="sub"></div>
      </div>

      <div class="toolbar">
        <button id="music" class="chip sound" aria-pressed="false" aria-label="Turn sound on" title="Sound (M)">
          <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M15 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
          <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
        </button>
        <button id="inkmode" class="chip" title="Paper (I)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6" /><path d="M12 4.5a7.5 7.5 0 0 1 0 15z" /></svg>
        </button>
        <button id="minimap" class="chip" aria-pressed="true" title="Map (P)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5l5.5-2 6 2 5.5-2v13l-5.5 2-6-2-5.5 2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" /><path d="M9 4.5v13M15 6.5v13" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
        </button>
        <button id="north" class="chip" aria-label="Reset north up" title="North up (N)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l4 8.5h-8z" /><path d="M8 12h8l-4 8.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" /></svg>
        </button>
      </div>

      <div class="topright">
        <div id="mapbox" class="mapbox"></div>
      </div>

      <div class="hint">w/s throttle · a/d yaw · ↓↑ pitch · ←→ roll · i ink · p map · n north · m sound</div>
    </div>

    <div id="veil">
      <div class="veil-title">PAPER ALPS</div>
      <div class="veil-sub">unfolding terrain…</div>
      <div class="veil-actions">
        <button id="enter" class="enter" title="Enter (↵)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" /></svg>
          <span>FLY</span>
        </button>
        <button id="veil-sound" class="chip sound" aria-pressed="true" aria-label="Turn sound off" title="Sound">
          <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M15 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
          <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
        </button>
      </div>
    </div>

    <footer class="credits">
      DEM <a href="https://mapterhorn.com" target="_blank" rel="noopener">Mapterhorn</a> · peaks © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
